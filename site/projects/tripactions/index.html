<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darling &amp; Friends · Page moved</title>
  <link rel="canonical" href="https://darlingandfriends.com/projects/tripactions">
  <noscript><meta http-equiv="refresh" content="0; url=https://darlingandfriends.com/projects/tripactions"></noscript>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { box-sizing: border-box; max-width: 42rem; margin: 16vh auto; padding: 1.5rem; line-height: 1.6; }
    h1 { font-family: Georgia, serif; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 400; line-height: 1.1; }
    a { color: inherit; text-underline-offset: .2em; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>This page has moved.</h1>
    <p>Continue to Darling &amp; Friends at <a id="destination" href="https://darlingandfriends.com/projects/tripactions">https://darlingandfriends.com/projects/tripactions</a>.</p>
  </main>
  <script>
(() => {
  const current = new URL(window.location.href);
  const destination = new URL("https://darlingandfriends.com");
  const aliases = {"/jules-haggards-creative-network":"/jules-darlings-creative-network"};
  const lookup = current.pathname.replace(/\/+$/, '') || '/';
  const mapped = Object.prototype.hasOwnProperty.call(aliases, lookup) ? aliases[lookup] : current.pathname;
  destination.pathname = mapped;
  if (mapped !== '/' && current.pathname.endsWith('/') && !mapped.endsWith('/')) destination.pathname += '/';
  destination.search = current.search;
  destination.hash = current.hash;
  const link = document.getElementById('destination');
  if (link) link.href = destination.href;
  window.location.replace(destination.href);
})();
  </script>
</body>
</html>
